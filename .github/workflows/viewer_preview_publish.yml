name: Publish viewer preview
# PR artifacts are untrusted. Do not execute their contents.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Build viewer preview]
    types: [completed]
permissions:
  contents: read

concurrency:
  group: viewer-preview-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'failure' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false
  queue: max

env:
  PREVIEW_REPO: mozilla/pdf.js.refs
  PREVIEW_URL: https://mozilla.github.io/pdf.js.refs/viewers
  RETENTION_DAYS: 30
  LABEL: viewer-preview
  APPROVAL_CONTEXT: viewer-preview/approval

jobs:
  publish:
    if: >-
      github.repository == 'mozilla/pdf.js' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: sync_pdfs
      deployment: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      ARTIFACT: ${{ github.workspace }}/../viewer-preview-artifact
      SITE: ${{ github.workspace }}/../viewer-preview-site

    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Find the artifact
        id: artifact
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "viewer-preview" and (.expired | not))] | length')"
          if [ "$count" -eq 1 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No viewer-preview artifact in run ${RUN_ID}"
          fi

      - name: Download the artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-preview
          path: ${{ env.ARTIFACT }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the pull request
        if: steps.artifact.outputs.found == 'true'
        id: check
        run: .github/scripts/viewer-preview/check-pr.sh

      - name: Prepare the viewers
        if: steps.check.outputs.action == 'publish'
        id: site
        env:
          PR: ${{ steps.check.outputs.pr }}
        run: .github/scripts/viewer-preview/prepare-site.sh

      - name: List the open pull requests
        if: steps.check.outputs.action == 'publish' || steps.check.outputs.action == 'remove'
        id: open
        run: |
          echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].number' > "$RUNNER_TEMP/open-prs.txt" ||
            { echo "::warning::Could not list the open PRs"; : > "$RUNNER_TEMP/open-prs.txt"; }

      - name: Generate app token for pdf.js.refs
        if: steps.check.outputs.action == 'publish' || steps.check.outputs.action == 'remove'
        id: refs-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mozilla
          repositories: pdf.js.refs
          permission-contents: write

      - name: Publish the viewers
        if: steps.check.outputs.action == 'publish' || steps.check.outputs.action == 'remove'
        id: publish
        env:
          GH_TOKEN: ${{ steps.refs-token.outputs.token }}
          PR: ${{ steps.check.outputs.pr }}
          BUILT: ${{ steps.site.outputs.built }}
          OPEN_PRS_TIME: ${{ steps.open.outputs.time }}
        run: |
          [ "$BUILT" = true ] || unset SITE
          OPEN_PRS="$RUNNER_TEMP/open-prs.txt" \
            .github/scripts/viewer-preview/publish-pages.sh

      - name: Comment on the PR
        if: >-
          always() && steps.check.outputs.pr &&
          (steps.check.outputs.action != 'remove' || steps.publish.outcome == 'success')
        env:
          PR: ${{ steps.check.outputs.pr }}
          ACTION: ${{ steps.check.outputs.action }}
          APPROVAL: ${{ steps.check.outputs.approval }}
          CREATE: ${{ steps.check.outputs.action != 'remove' }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DEPLOY: ${{ steps.publish.outcome == 'success' && steps.site.outputs.built == 'true' && 'pending' || '' }}
          BUILD_RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/viewer-preview/comment.mjs > "$RUNNER_TEMP/comment.md"
          if [ "$DEPLOY" != pending ]; then
            cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          BODY="$RUNNER_TEMP/comment.md" .github/scripts/viewer-preview/update-comment.sh

      - name: Wait for preview deployment
        if: steps.publish.outcome == 'success' && steps.site.outputs.built == 'true'
        id: live
        timeout-minutes: 12
        env:
          PR: ${{ steps.check.outputs.pr }}
          PUBLISHED_AT: ${{ steps.site.outputs.date }}
        run: |
          deadline=$(($(date +%s) + 600))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -sf --connect-timeout 5 --max-time 10 \
              "${PREVIEW_URL}/${PR}/meta.json?t=$(date +%s%N)" |
              jq -e --arg sha "$HEAD_SHA" --arg date "$PUBLISHED_AT" \
                '.sha == $sha and .date == $date' >/dev/null 2>&1; then
              echo "deploy=live" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Preview deployment was not confirmed within 10 minutes"
          echo "deploy=timeout" >> "$GITHUB_OUTPUT"

      - name: Link the viewers in the comment
        if: always() && steps.publish.outcome == 'success' && steps.site.outputs.built == 'true'
        env:
          PR: ${{ steps.check.outputs.pr }}
          ACTION: ${{ steps.check.outputs.action }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DEPLOY: ${{ steps.live.outputs.deploy || 'timeout' }}
          BUILD_RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/viewer-preview/comment.mjs > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          BODY="$RUNNER_TEMP/comment.md" .github/scripts/viewer-preview/update-comment.sh
